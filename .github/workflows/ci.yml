name: CI

on:
  push:
    branches: [ ci-experimental ]
  pull_request:
    branches: [ master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full zip unzip lzip

      - name: Install libjxl 0.12.0 (static, from GitHub releases)
        run: |
          wget -q https://github.com/libjxl/libjxl/releases/download/v0.12.0/jxl-linux-x86_64-static.tar.lz
          tar --lzip -xf jxl-linux-x86_64-static.tar.lz
          sudo install -m 0755 tools/djxl /usr/local/bin/djxl
          djxl --version

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build client
        run: npm run build:client

      - name: Prepkg linux
        run: node build/prepkg.js linux

      - name: Build bundle
        run: npm run build:bundle

      - name: Smoke test
        run: npm run test:smoke